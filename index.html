.orange{background:#d68910}

color:#fff;

padding:9px 0;
border-bottom:1px solid #263c55
}
.money{color:#5de6b7;font-weight:bold}
.player{

justify-content:space-between;
align-items:center;
gap:8px;
padding:10px 0;

.rating{
background:#168f72;
padding:6px 8px;
border-radius:7px;
font-weight:bold

.small{
font-size:12px;

.notice{

font-size:11px;
margin-top:5px

.nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
display:grid;

border-top:1px solid #24394e;
z-index:10
}
.nav button{
padding:9px 2px;
font-size:10px;
background:#152a42

.result{
text-align:center;
font-size:27px;
font-weight:bold;

.big{font-size:40px}
.table{
width:100%;

font-size:12px
}
.table th,.table td{
padding:8px 3px;
border-bottom:1px solid #263c55;
text-align:center
}
.table td:nth-child(2),
.table th:nth-child(2){
text-align:left

.offer{
border-left:4px solid #16a085;
padding-left:10px

.price{

===================================================== */

let careers = []; // Tüm kayıtlı kariyerler listesi
let activeCareerId = null; // Şu an oynanan kariyerin ID'si

let game = {
club: null,
league: null,
season: 2026,
week: 1,
budget: 0,
squad: [],
loans: [],
incomingOffers: [],
outgoingOffers: []
};

let clubState = {};


/* Tüm verileri tarayıcı hafızasına (localStorage) kaydet */
function saveAllData(){
let dataToSave = {
careers: careers,
activeCareerId: activeCareerId,
clubState: clubState,
game: game
};
localStorage.setItem("TD_2026_MULTICAREER_DATA", JSON.stringify(dataToSave));
}


/* Kayıtlı verileri tarayıcı hafızasından yükle */
function loadAllData(){
let data = localStorage.getItem("TD_2026_MULTICAREER_DATA");
if(!data) return false;
try{
let parsed = JSON.parse(data);
careers = parsed.careers || [];
activeCareerId = parsed.activeCareerId !== undefined ? parsed.activeCareerId : null;
clubState = parsed.clubState || {};
if(activeCareerId !== null){
let found = careers.find(c => c.id === activeCareerId);
if(found){
game = found.gameData;
}
}
return true;
}catch(e){
return false;
}
}


/* Aktif oyun durumunu güncel kariyer içine kaydet ve depola */
function saveGame(){
if(activeCareerId !== null){
let index = careers.findIndex(c => c.id === activeCareerId);
if(index !== -1){
careers[index].gameData = JSON.parse(JSON.stringify(game));
careers[index].name = game.careerName || careers[index].name;
}
}
saveAllData();
}


/* =====================================================
   YARDIMCI FONKSİYONLAR
===================================================== */

function money(n){
if(n>=1000000000) return "€"+(n/1000000000).toFixed(1)+" Milyar";
if(n>=1000000) return "€"+(n/1000000).toFixed(1)+" M";
return "€"+Math.round(n).toLocaleString("tr-TR");
}

function currentClub(){
return clubState[game.club];
}

function teamRating(){
let all=[...game.squad, ...game.loans];
if(!all.length) return 0;
return Math.round(all.reduce((a,p)=>a+p.rating,0)/all.length);
}

</div>
`;
});
}

document.getElementById("content").innerHTML = html;
}

function updateClubSelect(){
let league = document.getElementById("leagueSelect").value;
let clubSelect = document.getElementById("clubSelect");
if(!league){
clubSelect.innerHTML = "<option>Önce lig seç</option>";
return;
}
clubSelect.innerHTML = leagues[league].map(x=>`<option>${x}</option>`).join("");
}


/* Yeni Kariyeri Kaydet ve Başlat */
function createNewCareerAction(){
let name = document.getElementById("newCareerNameInput").value.trim();
let league = document.getElementById("leagueSelect").value;
let club = document.getElementById("clubSelect").value;

if(!name) name = "Kariyer " + (careers.length + 1);
if(!league || !club){
alert("Lütfen lig ve kulüp seçin.");
return;
}

// Tüm ligler için kulüp durumlarını sıfırdan kur (eğer yoksa)
Object.keys(leagues).forEach(l => {
leagues[l].forEach(cName => {
if(!clubState[cName]){
clubState[cName]={
played:0, wins:0, draws:0, losses:0, points:0, gf:0, ga:0,
strength:72+Math.floor(Math.random()*15),
budget:clubBudgets[cName]||1000000000
};
}
});
});

let newId = Date.now();

let newGameObj = {
careerName: name,
club: club,
league: league,
season: 2026,
week: 1,
budget: clubBudgets[club] || 1000000000,
squad: [],
loans: [],
incomingOffers: [],
outgoingOffers: []
};

// Bu kulübün oyuncularını kadroya diz
players.filter(p=>p[1]===club).forEach(p=>{
newGameObj.squad.push({
name:p[0], club:p[1], rating:p[2], position:p[3], value:p[4], age:p[5], goals:0, assists:0
});
});

careers.push({
id: newId,
name: name,
gameData: newGameObj
});

activeCareerId = newId;
game = newGameObj;

saveAllData();
home();
}


/* Kayıtlı bir kariyere giriş yap */
function selectCareer(id){
let found = careers.find(c => c.id === id);
if(!found) return;
activeCareerId = found.id;
game = found.gameData;
saveAllData();
home();
}


/* Kariyer sil */
function deleteCareer(id){
if(!confirm("Bu kariyeri kalıcı olarak silmek istediğinden emin misin?")) return;
careers = careers.filter(c => c.id !== id);
if(activeCareerId === id){
activeCareerId = null;
game = {club:null};
}
saveAllData();
careerListMenu();
}

   TAKIM DEĞİŞTİRME SİSTEMİ (Mevcut kariyer içinde)
===================================================== */

function updateNewClubSelect(){
let league = document.getElementById("newLeagueSelect").value;

}

function confirmChangeTeam(){

let club = document.getElementById("newClubSelect").value;
if(!league || !club){
alert("Lütfen lig ve kulüp seç.");
return;
}

game.league = league;

if(!clubState[club]){
clubState[club]={
played:0, wins:0, draws:0, losses:0, points:0, gf:0, ga:0,
strength:72+Math.floor(Math.random()*15),
budget:clubBudgets[club]
};
}

// Yeni kulübün oyuncularını kadroya ekle

});

/* =====================================================
   OYUNCU SAT
===================================================== */

function sellPlayer(i){
if(game.squad.length<=11){ alert("En az 11 oyuncu kalmalı."); return; }
let p=game.squad[i];
let price=Math.round(p.value*.8);
let answer=prompt(p.name+" için satış fiyatını gir.\n\nPiyasa değeri: "+money(p.value), price);
if(answer===null)return;
let offer=Number(answer);
if(!offer||offer<=0){ alert("Geçerli bir fiyat gir."); return; }

game.incomingOffers.push({
type:"sale", player:p.name, amount:offer, club:randomOtherClub()
});
saveGame();
alert("📩 "+randomOtherClub()+" kulübünden teklif geldi!");
offersPage();
}


/* =====================================================
   TRANSFER PAZARI
===================================================== */

<input id="search" placeholder="🔎 Oyuncu ara..." oninput="filterMarket()">

`;

list.forEach(p=>{

<b>${p[0]}</b>

</div>

let q=document.getElementById("search").value.toLowerCase();

el.style.display=el.dataset.name.includes(q)?"block":"none";
});

/* =====================================================
   PAZARLIK & TRANSFER İŞLEMLERİ
===================================================== */

function negotiate(name){
let p=players.find(x=>x[0]===name);
if(!p)return;
let value=p[4];
document.getElementById("content").innerHTML=`
<div class="title">🤝 Transfer Pazarlığı</div>
<div class="card">
<div class="player">
<div>
<b>${p[0]}</b>
<div class="small">${p[1]}</div>
<div class="small">${p[3]} • ${p[5]} yaş</div>
</div>
<span class="rating">${p[2]}</span>
</div>
<div class="stat"><span>Piyasa değeri</span><b>${money(value)}</b></div>
<div class="notice">Kulüp piyasa değerinin <strong>%85 - %140</strong> arasında teklifleri değerlendirebilir.</div>
<input id="offerPrice" type="number" value="${value}" placeholder="Teklif">
<button class="green" style="width:100%;margin-bottom:7px" onclick="makeOffer('${p[0]}')">💰 TEKLİF GÖNDER</button>
<button class="gray" style="width:100%" onclick="market()">GERİ DÖN</button>
</div>
`;
}

function makeOffer(name){
let p=players.find(x=>x[0]===name);
if(!p)return;
let amount=Number(document.getElementById("offerPrice").value);
if(!amount||amount<=0){ alert("Geçerli teklif gir."); return; }
if(amount>game.budget){ alert("Bütçen yetmiyor."); return; }

let ratio=amount/p[4];
let sellerClub=p[1];
let decision;

if(ratio>=1.25) decision="accept";
else if(ratio>=1.05) decision=Math.random()<0.75?"accept":"counter";
else if(ratio>=0.85) decision=Math.random()<0.55?"counter":"reject";
else decision="reject";

if(decision==="accept"){ completeTransfer(p, amount, sellerClub); return; }
if(decision==="reject"){ alert(sellerClub+" teklifini reddetti."); return; }

let counter=Math.round(p[4]*(1.10+Math.random()*.20));
game.outgoingOffers.push({ player:p[0], club:sellerClub, amount:amount, counter:counter });
saveGame();
showCounterOffer(p, sellerClub, amount, counter);
}

function showCounterOffer(p, sellerClub, yourOffer, counter){
document.getElementById("content").innerHTML=`
<div class="title">🤝 Karşı Teklif</div>
<div class="card offer">
<div class="notice"><strong>${sellerClub}</strong>, ${p[0]} için teklifini değerlendirdi.</div>
<div class="stat"><span>Senin teklifin</span><b>${money(yourOffer)}</b></div>
<div class="stat"><span>Karşı teklif</span><b class="price">${money(counter)}</b></div>
<div class="stat"><span>Oyuncunun değeri</span><b>${money(p[4])}</b></div>
<button class="green" style="width:100%;margin-bottom:7px" onclick="acceptCounter('${p[0]}',${counter})">✅ KARŞI TEKLİFİ KABUL ET</button>
<button class="orange" style="width:100%;margin-bottom:7px" onclick="counterAgain('${p[0]}',${counter})">💬 YENİ TEKLİF VER</button>
<button class="red" style="width:100%" onclick="market()">❌ PAZARLIĞI BİTİR</button>
</div>
`;
}

function acceptCounter(name, amount){
let p=players.find(x=>x[0]===name);
if(!p)return;
if(game.budget<amount){ alert("Bütçen yetmiyor."); return; }
completeTransfer(p, amount, p[1]);
}

function counterAgain(name, oldAmount){
let p=players.find(x=>x[0]===name);
if(!p)return;
let newOffer=prompt("Yeni teklif miktarını gir.\n\nKarşı teklif: "+money(oldAmount), oldAmount);
if(newOffer===null)return;
newOffer=Number(newOffer);
if(newOffer<=0)return;
if(newOffer>game.budget){ alert("Bütçen yetmiyor."); return; }

let ratio=newOffer/p[4];
if(ratio>=1.15){ completeTransfer(p, newOffer, p[1]); }
else if(ratio>=.90){
let counter=Math.round(p[4]*(1.05+Math.random()*.12));
showCounterOffer(p, p[1], newOffer, counter);
}else{
alert(p[1]+" yeni teklifini de reddetti.");
}
}

function completeTransfer(p, amount, sellerClub){
if(game.squad.length>=25){ alert("Kadro maksimum 25 oyuncu."); return; }
if(game.budget<amount){ alert("Bütçen yetmiyor."); return; }

game.budget-=amount;
if(clubState[sellerClub]) clubState[sellerClub].budget+=amount;

game.squad.push({
name:p[0], club:game.club, rating:p[2], position:p[3], value:p[4], age:p[5], goals:0, assists:0
});
saveGame();

document.getElementById("content").innerHTML=`
<div class="title">🎉 TRANSFER TAMAMLANDI</div>
<div class="card">
<div class="result">${p[0]}<div class="big">${p[2]}</div></div>
<div class="stat"><span>Eski kulüp</span><b>${sellerClub}</b></div>
<div class="stat"><span>Bonservis</span><b class="money">${money(amount)}</b></div>
<div class="stat"><span>Kalan bütçe</span><b class="money">${money(game.budget)}</b></div>
</div>
<button class="green" style="width:100%" onclick="market()">TRANSFER PAZARINA DÖN</button>
`;
}


/* =====================================================
   TEKLİFLER SAYFASI
===================================================== */

function offersPage(){
let html=`<div class="title">📩 Transfer Teklifleri</div>`;
if(!game.incomingOffers.length && !game.outgoingOffers.length){
html+=`<div class="card"><div class="notice">Şu anda bekleyen teklif yok.</div></div>`;
}

game.incomingOffers.forEach((offer,i)=>{
let p=game.squad.find(x=>x.name===offer.player);
if(!p)return;
html+=`
<div class="card offer">
<div class="title">📩 ${offer.club}</div>
<b>${p.name}</b>
<div class="small">Oyuncu: ${p.position}</div>
<div class="stat"><span>Teklif</span><b class="price">${money(offer.amount)}</b></div>
<button class="green" onclick="acceptIncoming(${i})">KABUL ET</button>
<button class="red" onclick="rejectIncoming(${i})">REDDET</button>
</div>
`;
});
document.getElementById("content").innerHTML=html;
}

function acceptIncoming(i){
let offer=game.incomingOffers[i];
let index=game.squad.findIndex(p=>p.name===offer.player);
if(index===-1)return;
game.budget+=offer.amount;
game.squad.splice(index,1);
game.incomingOffers.splice(i,1);
saveGame();
alert(offer.player+" satıldı.\n"+money(offer.amount)+" kazandın.");
offersPage();
}

function rejectIncoming(i){
game.incomingOffers.splice(i,1);
saveGame();
offersPage();
}

function randomOtherClub(){
let list=leagues[game.league].filter(x=>x!==game.club);
return list[Math.floor(Math.random()*list.length)];
}


/* =====================================================
   KİRALIK TRANSFER
===================================================== */

function loans(){
if(!game.club){ home(); return; }
let html=`
<div class="title">🔄 Kiralık Transfer</div>
<div class="card">
<div class="stat"><span>Kiralık</span><b>${game.loans.length}/5</b></div>
<div class="stat"><span>Bütçe</span><b class="money">${money(game.budget)}</b></div>
</div>
`;

players.filter(p=>!game.squad.some(x=>x.name===p[0]) && !game.loans.some(x=>x.name===p[0])).forEach(p=>{
let fee=Math.round(p[4]*.08);
html+=`
<div class="card">
<div class="player">
<div>
<b>${p[0]}</b>
<div class="small">${p[1]} • ${p[3]}</div>
<div class="small">Kiralama: ${money(fee)}</div>
</div>
<div>
<span class="rating">${p[2]}</span><br><br>
<button class="orange" onclick="loanPlayer('${p[0]}')">KİRALA</button>
</div>
</div>
</div>
`;
});
document.getElementById("content").innerHTML=html;
}

function loanPlayer(name){
if(game.loans.length>=5){ alert("En fazla 5 kiralık oyuncu."); return; }
let p=players.find(x=>x[0]===name);
if(!p)return;
let fee=Math.round(p[4]*.08);
if(game.budget<fee){ alert("Bütçen yetmiyor."); return; }

game.budget-=fee;
game.loans.push({ name:p[0], rating:p[2], position:p[3], value:p[4], age:p[5] });
saveGame();
loans();
}


/* =====================================================
   MAÇ SİSTEMİ
===================================================== */

function playMatch(){
let teams=leagues[game.league].filter(x=>x!==game.club);
let opponent=teams[(game.week-1)%teams.length];

let myPower=teamRating();
let enemy=clubState[opponent].strength;

let myGoals=Math.floor(Math.random()*4);
let enemyGoals=Math.floor(Math.random()*4);

if(myPower>enemy+8) myGoals=Math.max(myGoals, enemyGoals+1);
if(enemy>myPower+8) enemyGoals=Math.max(enemyGoals, myGoals+1);

let c=currentClub();
let o=clubState[opponent];

c.played++; o.played++;
c.gf+=myGoals; c.ga+=enemyGoals;
o.gf+=enemyGoals; o.ga+=myGoals;

let result;
if(myGoals>enemyGoals){
c.wins++; c.points+=3; game.budget+=5000000; result="🏆 GALİBİYET";
}else if(myGoals===enemyGoals){
c.draws++; c.points++; game.budget+=2000000; result="🤝 BERABERLİK";
}else{
c.losses++; result="❌ MAĞLUBİYET";
}

game.squad.forEach(p=>{
if(Math.random()<.2 && myGoals>0) p.goals++;
});

game.week++;
saveGame();

document.getElementById("content").innerHTML=`
<div class="title">⚽ Maç Sonucu</div>
<div class="card">
<div class="result">${game.club}<br><span class="big">${myGoals} - ${enemyGoals}</span><br>${opponent}</div>
<h2 style="text-align:center">${result}</h2>
</div>
<div class="card">
<div class="stat"><span>🏆 Puan</span><b>${c.points}</b></div>
<div class="stat"><span>💰 Bütçe</span><b class="money">${money(game.budget)}</b></div>
<div class="stat"><span>📅 Hafta</span><b>${game.week}/38</b></div>
</div>
<button class="green" style="width:100%" onclick="home()">DEVAM ET</button>
`;
}


/* =====================================================
   ANTRENMAN
===================================================== */

function training(){
if(game.budget<100000){ alert("€100.000 gerekiyor."); return; }
game.budget-=100000;
game.squad.forEach(p=>{
if(Math.random()<.35 && p.rating<95) p.rating++;
});
saveGame();
alert("🏋️ Antrenman tamamlandı.");
home();
}


/* =====================================================
   PUAN DURUMU
===================================================== */

function table(){
if(!game.club){ home(); return; }
let teams=leagues[game.league].map(name=>({
name:name, ...clubState[name]
})).sort((a,b)=>{
if(b.points!==a.points) return b.points-a.points;
return (b.gf-b.ga)-(a.gf-a.ga);
});

let html=`
<div class="title">🏆 ${game.league}</div>
<div class="card">
<table class="table">
<tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr>
${teams.map((c,i)=>`
<tr>
<td>${i+1}</td>
<td>${c.name} ${c.name===game.club?`<span class="badge">SEN</span>`:""}</td>
<td>${c.played}</td><td>${c.wins}</td><td>${c.draws}</td><td>${c.losses}</td>
<td>${c.gf-c.ga}</td><td><b>${c.points}</b></td>
</tr>
`).join("")}
</table>
</div>
`;
document.getElementById("content").innerHTML=html;
}


/* =====================================================
   UYGULAMA BAŞLANGICI
===================================================== */

if(loadAllData()){
if(activeCareerId !== null && game.club){
home();
}else{
careerListMenu();
}
}else{
careerListMenu();
}

</script>
