<title>Teknik Direktör 2026</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#07111d;
color:#fff;
font-family:Arial,sans-serif;
-webkit-user-select:none;
user-select:none
}
.app{
max-width:520px;
min-height:100vh;
margin:auto;
background:#0c1828;
position:relative;
padding-bottom:20px
}
header{
padding:20px;
background:linear-gradient(135deg,#12345d,#087f5b)
}
header h1{margin:0;font-size:24px}
header p{margin:6px 0 0;color:#c9fff0;font-size:13px}
.page{padding:15px 15px 90px}
.card{
background:#13243a;
border:1px solid #223b56;
border-radius:15px;
padding:15px;
margin-bottom:12px
}
.title{
font-size:21px;
font-weight:bold;
margin-bottom:12px
}
button{
border:0;
border-radius:11px;
padding:11px;
color:#fff;
font-weight:bold;
background:#285071;
cursor:pointer
}
button:active{transform:scale(.97)}
.green{background:#16a085}
.blue{background:#2477d4}
.red{background:#c0392b}
.orange{background:#d68910}
.gray{background:#46586a}
select,input{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #38536e;
background:#091522;
color:#fff;
margin:6px 0 12px
}
.stat{
display:flex;
justify-content:space-between;
padding:9px 0;
border-bottom:1px solid #263c55
}
.money{color:#5de6b7;font-weight:bold}
.player{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
padding:10px 0;
border-bottom:1px solid #263c55
}
.rating{
background:#168f72;
padding:6px 8px;
border-radius:7px;
font-weight:bold
}
.small{
font-size:12px;
color:#9eb4ca;
margin-top:4px
}
.notice{
background:#19334a;
padding:11px;
border-radius:10px;
margin-bottom:10px
}
.badge{
display:inline-block;
padding:4px 7px;
border-radius:6px;
background:#29465f;
font-size:11px;
margin-top:5px
}
.nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:100%;
max-width:520px;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:5px;
padding:7px;
background:#081321;
border-top:1px solid #24394e;
z-index:10
}
.nav button{
padding:9px 2px;
font-size:10px;
background:#152a42
}
.result{
text-align:center;
font-size:27px;
font-weight:bold;
padding:20px 5px
}
.big{font-size:40px}
.table{
width:100%;
border-collapse:collapse;
font-size:12px
}
.table th,.table td{
padding:8px 3px;
border-bottom:1px solid #263c55;
text-align:center
}
.table td:nth-child(2),
.table th:nth-child(2){
text-align:left
}
.offer{
border-left:4px solid #16a085;
padding-left:10px
}
.price{
font-size:20px;
font-weight:bold;
color:#5de6b7
}
</style>
</head>

/* =====================================================
   YARDIMCI FONKSİYONLAR
===================================================== */

function money(n){
if(n>=1000000000) return "€"+(n/1000000000).toFixed(1)+" Milyar";
if(n>=1000000) return "€"+(n/1000000).toFixed(1)+" M";
return "€"+Math.round(n).toLocaleString("tr-TR");
}

function currentClub(){
return clubState[game.club];
}

function teamRating(){
let all=[...game.squad, ...game.loans];
if(!all.length) return 0;
let top=all.slice().sort((a,b)=>b.rating-a.rating).slice(0,14);
return Math.round(top.reduce((a,p)=>a+p.rating,0)/top.length);
}

/* Kulübün gerçek gücü: kadrodaki en iyi 14 oyuncunun ortalaması */
function baseStrength(club){
let sq=players.filter(p=>p[1]===club);
if(!sq.length) return 70;
let top=sq.slice().sort((a,b)=>b[2]-a[2]).slice(0,14);
return Math.round(top.reduce((s,p)=>s+p[2],0)/top.length);
}

function newClubState(name){
return {played:0,wins:0,draws:0,losses:0,points:0,gf:0,ga:0,
strength:baseStrength(name), budget:clubBudgets[name]||1000000000};
}

/* Berger fixtür: her hafta ligdeki HERKES maç yapar */
const fixtureCache={};
function getFixtures(league){
if(fixtureCache[league]) return fixtureCache[league];
let arr=[...leagues[league]];
if(arr.length%2) arr.push(null);
let n=arr.length, rounds=[];
for(let r=0;r<n-1;r++){
let round=[];
for(let i=0;i<n/2;i++){
let h=arr[i], a=arr[n-1-i];
if(h&&a) round.push(r%2===0?[h,a]:[a,h]);
}
rounds.push(round);
arr.splice(1,0,arr.pop());
}
rounds=rounds.concat(rounds.map(rd=>rd.map(m=>[m[1],m[0]])));
fixtureCache[league]=rounds;
return rounds;
}

function totalWeeks(){
return game.league? getFixtures(game.league).length : 38;
}

/* Poisson gol üretimi - güç farkına göre */
function simGoals(att,def){
let lambda=Math.max(0.15, 1.30+((att-def)/6)*0.55);
let L=Math.exp(-lambda), k=0, p=1;
do{ k++; p*=Math.random(); }while(p>L);
return k-1;
}

function applyResult(h,a,hg,ag){
let H=clubState[h], A=clubState[a];
H.played++; A.played++;
H.gf+=hg; H.ga+=ag; A.gf+=ag; A.ga+=hg;
if(hg>ag){ H.wins++; H.points+=3; A.losses++; }
else if(hg<ag){ A.wins++; A.points+=3; H.losses++; }
else { H.draws++; A.draws++; H.points++; A.points++; }
}

function negotiate(name){
let p=players.find(x=>x[0]===name);

let value=p[4];
document.getElementById("content").innerHTML=`

<input id="offerPrice" type="number" value="${value}" placeholder="Teklif">

<button class="gray" style="width:100%" onclick="market()">GERİ DÖN</button>
</div>
`;
}

function makeOffer(name){
let p=players.find(x=>x[0]===name);
if(!p)return;
let amount=Number(document.getElementById("offerPrice").value);
if(!amount||amount<=0){ alert("Geçerli teklif gir."); return; }
if(amount>game.budget){ alert("Bütçen yetmiyor."); return; }

let ratio=amount/p[4];
let sellerClub=p[1];
let decision;

if(ratio>=1.25) decision="accept";
else if(ratio>=1.05) decision=Math.random()<0.75?"accept":"counter";
else if(ratio>=0.85) decision=Math.random()<0.55?"counter":"reject";
else decision="reject";

if(decision==="accept"){ completeTransfer(p, amount, sellerClub); return; }
if(decision==="reject"){ alert(sellerClub+" teklifini reddetti."); return; }

let counter=Math.round(p[4]*(1.10+Math.random()*.20));
game.outgoingOffers.push({ player:p[0], club:sellerClub, amount:amount, counter:counter });
saveGame();
showCounterOffer(p, sellerClub, amount, counter);
}

function showCounterOffer(p, sellerClub, yourOffer, counter){
document.getElementById("content").innerHTML=`
<div class="title">🤝 Karşı Teklif</div>
<div class="card offer">
<div class="notice"><strong>${sellerClub}</strong>, ${p[0]} için teklifini değerlendirdi.</div>
<div class="stat"><span>Senin teklifin</span><b>${money(yourOffer)}</b></div>
<div class="stat"><span>Karşı teklif</span><b class="price">${money(counter)}</b></div>
<div class="stat"><span>Oyuncunun değeri</span><b>${money(p[4])}</b></div>
<button class="green" style="width:100%;margin-bottom:7px" onclick="acceptCounter('${p[0]}',${counter})">✅ KARŞI TEKLİFİ KABUL ET</button>
<button class="orange" style="width:100%;margin-bottom:7px" onclick="counterAgain('${p[0]}',${counter})">💬 YENİ TEKLİF VER</button>
<button class="red" style="width:100%" onclick="market()">❌ PAZARLIĞI BİTİR</button>
</div>
`;
}

function acceptCounter(name, amount){
let p=players.find(x=>x[0]===name);
if(!p)return;
if(game.budget<amount){ alert("Bütçen yetmiyor."); return; }
completeTransfer(p, amount, p[1]);
}

function counterAgain(name, oldAmount){
let p=players.find(x=>x[0]===name);
if(!p)return;
let newOffer=prompt("Yeni teklif miktarını gir.\n\nKarşı teklif: "+money(oldAmount), oldAmount);
if(newOffer===null)return;
newOffer=Number(newOffer);
if(newOffer<=0)return;
if(newOffer>game.budget){ alert("Bütçen yetmiyor."); return; }

let ratio=newOffer/p[4];
if(ratio>=1.15){ completeTransfer(p, newOffer, p[1]); }
else if(ratio>=.90){
let counter=Math.round(p[4]*(1.05+Math.random()*.12));
showCounterOffer(p, p[1], newOffer, counter);
}else{
alert(p[1]+" yeni teklifini de reddetti.");
}
}

function completeTransfer(p, amount, sellerClub){
if(game.squad.length>=25){ alert("Kadro maksimum 25 oyuncu."); return; }
if(game.budget<amount){ alert("Bütçen yetmiyor."); return; }

game.budget-=amount;
if(clubState[sellerClub]) clubState[sellerClub].budget+=amount;

game.squad.push({
name:p[0], club:game.club, rating:p[2], position:p[3], value:p[4], age:p[5], goals:0, assists:0
});
saveGame();

document.getElementById("content").innerHTML=`
<div class="title">🎉 TRANSFER TAMAMLANDI</div>
<div class="card">
<div class="result">${p[0]}<div class="big">${p[2]}</div></div>
<div class="stat"><span>Eski kulüp</span><b>${sellerClub}</b></div>
<div class="stat"><span>Bonservis</span><b class="money">${money(amount)}</b></div>
<div class="stat"><span>Kalan bütçe</span><b class="money">${money(game.budget)}</b></div>
</div>
<button class="green" style="width:100%" onclick="market()">TRANSFER PAZARINA DÖN</button>
`;
}

game.budget+=offer.amount;

game.incomingOffers.splice(i,1);
saveGame();
alert(offer.player+" satıldı.\n"+money(offer.amount)+" kazandın.");
offersPage();
}

function rejectIncoming(i){
game.incomingOffers.splice(i,1);
saveGame();
offersPage();
}

function randomOtherClub(){
let list=leagues[game.league].filter(x=>x!==game.club);
return list[Math.floor(Math.random()*list.length)];
}


/* =====================================================
   KİRALIK TRANSFER
===================================================== */

function loans(){
if(!game.club){ home(); return; }
let html=`
<div class="title">🔄 Kiralık Transfer</div>
<div class="card">
<div class="stat"><span>Kiralık</span><b>${game.loans.length}/5</b></div>
<div class="stat"><span>Bütçe</span><b class="money">${money(game.budget)}</b></div>
</div>
`;

players.filter(p=>!game.squad.some(x=>x.name===p[0]) && !game.loans.some(x=>x.name===p[0])).forEach(p=>{
let fee=Math.round(p[4]*.08);
html+=`
<div class="card">
<div class="player">
<div>
<b>${p[0]}</b>
<div class="small">${p[1]} • ${p[3]}</div>
<div class="small">Kiralama: ${money(fee)}</div>
</div>
<div>
<span class="rating">${p[2]}</span><br><br>
<button class="orange" onclick="loanPlayer('${p[0]}')">KİRALA</button>
</div>
</div>
</div>
`;
});
document.getElementById("content").innerHTML=html;
}

function loanPlayer(name){
if(game.loans.length>=5){ alert("En fazla 5 kiralık oyuncu."); return; }
let p=players.find(x=>x[0]===name);
if(!p)return;
let fee=Math.round(p[4]*.08);
if(game.budget<fee){ alert("Bütçen yetmiyor."); return; }

game.budget-=fee;
game.loans.push({ name:p[0], rating:p[2], position:p[3], value:p[4], age:p[5] });
saveGame();
loans();
}


/* =====================================================
   MAÇ SİSTEMİ
===================================================== */

function playMatch(){
let rounds=getFixtures(game.league);
if(game.week>rounds.length){ endSeason(); return; }

let round=rounds[game.week-1];
let myPower=teamRating();

leagues[game.league].forEach(n=>{ if(!clubState[n]) clubState[n]=newClubState(n); });
clubState[game.club].strength=myPower;

let myGoals=0, enemyGoals=0, opponent="", evimde=true, others=[];

round.forEach(m=>{
let h=m[0], a=m[1];
let hs=(h===game.club?myPower:clubState[h].strength)+3;
let as=(a===game.club?myPower:clubState[a].strength);
let hg=simGoals(hs,as), ag=simGoals(as,hs);
applyResult(h,a,hg,ag);

if(h===game.club){ myGoals=hg; enemyGoals=ag; opponent=a; evimde=true; }
else if(a===game.club){ myGoals=ag; enemyGoals=hg; opponent=h; evimde=false; }
else others.push(h+" "+hg+" - "+ag+" "+a);
});

let c=currentClub(), result;
if(myGoals>enemyGoals){ game.budget+=5000000; result="🏆 GALİBİYET"; }
else if(myGoals===enemyGoals){ game.budget+=2000000; result="🤝 BERABERLİK"; }
else { game.budget+=500000; result="❌ MAĞLUBİYET"; }

for(let i=0;i<myGoals;i++){
let cands=game.squad.filter(p=>["ST","LW","RW","CAM"].includes(p.position));
if(!cands.length) cands=game.squad;
let s=cands[Math.floor(Math.random()*cands.length)];
if(s) s.goals++;
}

game.week++;
saveGame();

let tbl=leagues[game.league].map(n=>({name:n,...clubState[n]}))
.sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
let sira=tbl.findIndex(t=>t.name===game.club)+1;

document.getElementById("content").innerHTML=`
<div class="title">⚽ Maç Sonucu</div>
<div class="card">
<div class="result">${evimde?game.club:opponent}<br><span class="big">${evimde?myGoals+" - "+enemyGoals:enemyGoals+" - "+myGoals}</span><br>${evimde?opponent:game.club}</div>
<h2 style="text-align:center">${result}</h2>
<div class="small" style="text-align:center">${evimde?"🏠 İç saha":"✈️ Deplasman"}</div>
</div>
<div class="card">
<div class="stat"><span>🏆 Puan</span><b>${c.points}</b></div>
<div class="stat"><span>📊 Sıra</span><b>${sira}. / ${tbl.length}</b></div>
<div class="stat"><span>💰 Bütçe</span><b class="money">${money(game.budget)}</b></div>
<div class="stat"><span>📅 Hafta</span><b>${game.week-1}/${rounds.length}</b></div>
</div>
<div class="card">
<div class="title">📋 Haftanın Diğer Maçları</div>
${others.map(x=>`<div class="small" style="padding:5px 0;border-bottom:1px solid #263c55">${x}</div>`).join("")}
</div>
<button class="green" style="width:100%" onclick="home()">DEVAM ET</button>
`;
}

function endSeason(){
let tbl=leagues[game.league].map(n=>({name:n,...clubState[n]}))
.sort((a,b)=> b.points-a.points || (b.gf-b.ga)-(a.gf-a.ga));
let sira=tbl.findIndex(t=>t.name===game.club)+1;
let odul=Math.round(200000000/sira);
game.budget+=odul;
game.season++;
game.week=1;

Object.keys(leagues).forEach(l=>leagues[l].forEach(n=>{
if(clubState[n]) Object.assign(clubState[n],{played:0,wins:0,draws:0,losses:0,points:0,gf:0,ga:0});
}));
game.squad.forEach(p=>{ p.age++; p.goals=0; });
saveGame();

document.getElementById("content").innerHTML=`
<div class="title">🏁 SEZON BİTTİ</div>
<div class="card">
<div class="result">🏆<br>${tbl[0].name}<div class="small">Şampiyon</div></div>
<div class="stat"><span>Senin sıran</span><b>${sira}.</b></div>
<div class="stat"><span>Puanın</span><b>${tbl[sira-1].points}</b></div>
<div class="stat"><span>Sezon ödülü</span><b class="money">${money(odul)}</b></div>
</div>
<button class="green" style="width:100%" onclick="home()">${game.season} SEZONUNA BAŞLA</button>
`;
}


/* =====================================================
   ANTRENMAN
===================================================== */

function training(){
if(game.budget<100000){ alert("€100.000 gerekiyor."); return; }
game.budget-=100000;
game.squad.forEach(p=>{
if(Math.random()<.35 && p.rating<95) p.rating++;
});
saveGame();
alert("🏋️ Antrenman tamamlandı.");
home();
}


/* =====================================================
   PUAN DURUMU
===================================================== */

function table(){
if(!game.club){ home(); return; }
let teams=leagues[game.league].map(name=>({
name:name, ...clubState[name]
})).sort((a,b)=>{
if(b.points!==a.points) return b.points-a.points;
return (b.gf-b.ga)-(a.gf-a.ga);
});

let html=`
<div class="title">🏆 ${game.league}</div>
<div class="card">
<table class="table">
<tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AV</th><th>P</th></tr>
${teams.map((c,i)=>`
<tr>
<td>${i+1}</td>
<td>${c.name} ${c.name===game.club?`<span class="badge">SEN</span>`:""}</td>
<td>${c.played}</td><td>${c.wins}</td><td>${c.draws}</td><td>${c.losses}</td>
<td>${c.gf-c.ga}</td><td><b>${c.points}</b></td>
</tr>
`).join("")}
</table>
</div>
`;
document.getElementById("content").innerHTML=html;
}


/* =====================================================
   UYGULAMA BAŞLANGICI
===================================================== */

/* Eski bozuk kayıtları onar */
function repairData(){
Object.keys(leagues).forEach(l=>leagues[l].forEach(n=>{
if(!clubState[n]) clubState[n]=newClubState(n);
else clubState[n].strength=baseStrength(n);
}));
if(game.club && clubState[game.club] && clubState[game.club].played===0 && game.week>1){
game.week=1;
}
}

if(loadAllData()){
repairData();
if(activeCareerId !== null && game.club){
home();
}else{
careerListMenu();
}
}else{
careerListMenu();
}

</script>
